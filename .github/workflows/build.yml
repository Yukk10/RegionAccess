name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: RegionAccess
          path: build/libs/*.jar

      # Версия берётся из build.gradle.kts. Релиз создаётся один раз на версию:
      # если тега v<версия> ещё нет — при пуше в main создаются тег и релиз.
      - name: Detect release
        id: release
        if: github.event_name != 'pull_request'
        run: |
          VERSION=$(sed -nE 's/^version = "(.+)"/\1/p' build.gradle.kts)
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          NOTES=".github/release-notes/$TAG.md"
          if [[ -f "$NOTES" ]]; then
            echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          fi
          cp src/main/resources/config.yml build/libs/config.yml

      - name: Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.release.outputs.notes }}
          generate_release_notes: ${{ steps.release.outputs.notes == '' }}
          files: |
            build/libs/*.jar
            build/libs/config.yml
